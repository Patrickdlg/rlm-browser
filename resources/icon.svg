<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="#11111b"/>

  <g transform="translate(256,256)">
    <!-- Snake body: ~310° arc, clockwise from upper-right to upper-left -->
    <path d="M 75,-152 A 170,170 0 1,1 -75,-152"
          fill="none" stroke="url(#body)" stroke-width="46"
          stroke-linecap="round"/>

    <!-- Head: wedge shape overlapping the tail end -->
    <polygon points="-48,-152 72,-192 72,-112" fill="#89b4fa"/>

    <!-- Eye -->
    <circle cx="44" cy="-162" r="9" fill="#11111b"/>
  </g>
</svg>
